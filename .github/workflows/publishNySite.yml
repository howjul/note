name: publish site
on: # 在什么时候触发工作流
  push: # 在从本地main分支被push到GitHub仓库时
    branches:
      - main
  pull_request: # 在main分支合并别人提的pr时
    branches:
      - main
jobs: # 工作流的具体内容
  deploy:
    runs-on: ubuntu-latest # 创建一个新的云端虚拟机 使用最新Ubuntu系统
    steps:
      - uses: actions/checkout@v7 # 先checkout到main分支
      - uses: actions/setup-python@v5 # 再安装Python3和相关环境
        with:
          python-version: 3.x
      - run: pip3 install mkdocs==1.6.1 mkdocs-material==9.7.7 # 使用pip包管理工具安装mkdocs-material
      # - run: pip3 install mkdocs-encryptcontent-plugin
      - run: pip3 install mkdocs-statistics-plugin==0.1.5
      - run: pip3 install mkdocs-jupyter==0.26.3
      - run: mkdocs gh-deploy --force # 使用mkdocs-material部署gh-pages分支

